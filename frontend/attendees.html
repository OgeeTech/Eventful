<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Attendees - Eventful</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #00dc82;
            --bg-dark: #0b0f14;
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-muted: #94A3B8;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        h2 {
            margin: 0;
            font-size: 1.8rem;
            color: white;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: 0.3s;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        /* TABLE STYLES */
        .table-container {
            background: rgba(21, 26, 35, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* User Avatar */
        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 35px;
            height: 35px;
            background: rgba(0, 220, 130, 0.1);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 1px solid rgba(0, 220, 130, 0.3);
        }

        /* Status Badges */
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .valid {
            background: rgba(0, 220, 130, 0.15);
            color: var(--primary);
            border: 1px solid rgba(0, 220, 130, 0.2);
        }

        .used {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-muted);
            border: 1px solid rgba(148, 163, 184, 0.2);
            text-decoration: line-through;
        }

        /* Copy Button */
        .btn-copy {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
            margin-left: 10px;
        }

        .btn-copy:hover {
            color: white;
        }

        /* MODAL STYLES */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #151A23;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .table-container {
                overflow-x: auto;
            }

            th,
            td {
                min-width: 120px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2 id="eventTitle">Loading...</h2>
            <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Attendee</th>
                        <th>Email Address</th>
                        <th>Ticket ID</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="attendeeList">
                    <tr>
                        <td colspan="4" style="text-align:center; padding: 30px; color:#94A3B8;">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="messageModal" class="modal">
        <div class="modal-content">
            <i id="msgIcon" class="fas fa-check-circle"
                style="font-size: 3.5rem; color:#00DC82; margin-bottom:15px;"></i>
            <h3 id="msgTitle" style="color:white; margin:0 0 10px 0;">Success</h3>
            <p id="msgText" style="color:#94A3B8; margin-bottom:20px;">Operation completed.</p>
            <button onclick="closeModal('messageModal')" class="btn-primary">Okay</button>
        </div>
    </div>

    <script>
        // 👇 1. POINT TO RENDER CLOUD SERVER
        const API_URL = "https://eventful-api-74t2.onrender.com/api";

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');
        const token = localStorage.getItem('token');

        if (!token || !eventId) {
            window.location.href = 'dashboard.html';
        }

        // --- UTILS ---
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function showMessage(title, text, isSuccess = true) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            const icon = document.getElementById('msgIcon');
            icon.className = isSuccess ? "fas fa-check-circle" : "fas fa-times-circle";
            icon.style.color = isSuccess ? "#00DC82" : "#ff4d4d";
            document.getElementById('messageModal').style.display = 'flex';
        }

        async function loadAttendees() {
            try {
                // 👇 USE API_URL HERE
                const response = await fetch(`${API_URL}/events/${eventId}/attendees`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('eventTitle').innerText = data.eventTitle;
                    const tbody = document.getElementById('attendeeList');

                    if (data.attendees.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px; color:#94A3B8;">No tickets sold yet.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = '';
                    data.attendees.forEach(user => {
                        const statusClass = user.status === 'valid' ? 'valid' : 'used';
                        const statusText = user.status === 'valid' ? 'Active' : 'Checked In';
                        const initial = user.name.charAt(0).toUpperCase();

                        // FIX: Show the raw 8-digit ID (or a placeholder if it's an old ticket)
                        const displayId = user.ticketId ? `#${user.ticketId}` : '-----';
                        const copyValue = user.ticketId || '';

                        tbody.innerHTML += `
                            <tr>
                                <td>
                                    <div class="user-cell">
                                        <div class="avatar">${initial}</div>
                                        <span>${user.name}</span>
                                    </div>
                                </td>
                                <td>${user.email}</td>
                                <td style="font-family: monospace; color: #00DC82; font-size: 1rem; letter-spacing: 1px;">
                                    ${displayId}
                                    ${user.ticketId ? `
                                        <button class="btn-copy" onclick="copyId('${copyValue}')" title="Copy ID">
                                            <i class="far fa-copy"></i>
                                        </button>
                                    ` : ''}
                                </td>
                                <td><span class="badge ${statusClass}">${statusText}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    showMessage("Error", data.message, false);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('attendeeList').innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px; color:#ff4d4d;">Failed to load data.</td></tr>';
            }
        }

        function copyId(text) {
            navigator.clipboard.writeText(text);
            showMessage("Copied", "Ticket ID copied to clipboard! 📋");
        }

        loadAttendees();
    </script>

</body>

</html>
