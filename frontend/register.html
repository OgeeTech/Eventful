<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Eventful</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ============================
   BASE & VARIABLES
============================ */
        :root {
            --bg-dark: #0B0E14;
            --bg-card: rgba(255, 255, 255, 0.04);
            --primary: #00DC82;
            --primary-hover: #00b86b;
            --text-white: #ffffff;
            --text-muted: #94A3B8;
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 16px;
        }

        /* ============================
   BACK LINK
============================ */
        .back-link {
            position: fixed;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.3s ease;
            z-index: 50;
        }

        .back-link:hover {
            color: var(--primary);
            transform: translateX(-4px);
        }

        /* ============================
   GLOW BLOBS
============================ */
        .glow-blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 220, 130, 0.18) 0%, transparent 70%);
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
        }

        /* ============================
   AUTH CONTAINER
============================ */
        .auth-container {
            width: 100%;
            max-width: 920px;
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 10;
        }

        /* ============================
   LEFT: ILLUSTRATION
============================ */
        .auth-illustration {
            flex: 1;
            padding: 48px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-right: 1px solid var(--glass-border);
            background: linear-gradient(135deg,
                    rgba(0, 220, 130, 0.12),
                    rgba(0, 0, 0, 0));
        }

        .graphic-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 18px rgba(0, 220, 130, 0.45));
        }

        .auth-illustration h3 {
            margin: 0 0 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .auth-illustration p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* ============================
   RIGHT: FORM SIDE
============================ */
        .auth-form-side {
            flex: 1.2;
            padding: 56px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-form-side h2 {
            margin: 0 0 8px;
            font-size: 1.9rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        /* ============================
   INPUT GROUPS
============================ */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: 0.3s;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 14px 14px 42px;
            font-size: 0.95rem;
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            outline: none;
            transition: 0.3s ease;
        }

        .input-group input::placeholder {
            color: #6b7280;
        }

        .input-group select option {
            background: #151A23;
            color: white;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 2px rgba(0, 220, 130, 0.15);
        }

        .input-group input:focus+i,
        .input-group select:focus+i {
            color: var(--primary);
        }

        /* ============================
   PRIMARY BUTTON
============================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 6px 18px rgba(0, 220, 130, 0.35);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* ============================
   STATUS & FOOTER TEXT
============================ */
        #status {
            text-align: center;
            margin-top: 18px;
            font-size: 0.9rem;
            min-height: 22px;
        }

        .auth-form-side a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-form-side a:hover {
            text-decoration: underline;
        }

        /* ============================
   MOBILE (≤768px)
============================ */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding-top: 80px;
            }

            .auth-container {
                flex-direction: column;
                max-width: 420px;
            }

            .auth-illustration {
                display: none;
            }

            .auth-form-side {
                padding: 40px 28px;
            }

            .auth-form-side h2 {
                font-size: 1.6rem;
            }

            .back-link {
                top: 16px;
                left: 16px;
            }
        }

        /* ============================
   SHOW / HIDE PASSWORD
============================ */
        .password-group {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>

    <div class="glow-blob" style="top: -10%; left: -10%;"></div>
    <div class="glow-blob"
        style="bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, rgba(0,0,0,0) 70%);">
    </div>

    <a href="landing.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="auth-container">

        <div class="auth-illustration">
            <i class="fas fa-user-plus graphic-icon"></i>
            <h3 style="color: white; margin-bottom: 10px;">Join Eventful</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Create an account to start hosting <br>or discovering amazing events.
            </p>
        </div>

        <div class="auth-form-side">
            <h2>Create Account</h2>
            <p class="subtitle">Fill in your details to get started.</p>

            <form id="registerForm">
                <div class="input-group">
                    <input type="text" id="name" placeholder="Full Name" required>
                    <i class="fas fa-user"></i>
                </div>

                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                    <i class="fas fa-envelope"></i>
                </div>

                <div class="input-group password-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fas fa-lock"></i>

                    <!-- toggle -->
                    <span class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>


                <div class="input-group">
                    <select id="role">
                        <option value="attendee"> I want to Buy Tickets</option>
                        <option value="creator">I want to Organize Events</option>
                    </select>
                    <i class="fas fa-users-cog"></i>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; border-radius: 8px; margin-top: 10px;">
                    Sign Up <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
                </button>
            </form>

            <p id="status" style="text-align: center; margin-top: 20px; font-size: 0.9rem; min-height: 20px;"></p>

            <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="signin.html"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">Log In</a>
            </div>
        </div>
    </div>

    <script>

        const API_URL = "https://eventful-api-74t2.onrender.com/api";

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            status.innerText = "Creating account...";
            status.style.color = "#00DC82"; // Mint Green for loading

            try {
                // 1. REGISTER (Using the full Render URL)
                const registerResponse = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });

                const registerData = await registerResponse.json();

                if (!registerResponse.ok) throw new Error(registerData.message || "Registration failed");

                // 2. AUTO-LOGIN (Using the full Render URL)
                status.innerText = "Account created! Logging in...";

                const loginResponse = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const loginData = await loginResponse.json();

                if (loginResponse.ok) {
                    // Save Data
                    localStorage.setItem('token', loginData.token);
                    localStorage.setItem('role', loginData.role);
                    localStorage.setItem('userId', loginData.user.id || loginData.user._id);

                    // SAFE NAME SAVING
                    if (loginData.user && loginData.user.name) {
                        localStorage.setItem('userName', loginData.user.name);
                    } else {
                        localStorage.setItem('userName', "User");
                    }

                    status.innerText = "Success! Redirecting...";

                    setTimeout(() => {
                        // Redirect based on role
                        if (loginData.user.role === 'creator') {
                            window.location.href = 'dashboard.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1000);
                } else {
                    throw new Error("Auto-login failed. Please sign in manually.");
                }

            } catch (err) {
                console.error(err);
                status.style.color = "#ff4d4d"; // Red for error
                status.innerText = err.message;
            }
        });

        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const icon = document.querySelector(".toggle-password i");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

    </script>

</body>

</html>
