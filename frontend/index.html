<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Events - Eventful</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* =====================
   ROOT & RESET
===================== */
        :root {
            --primary: #00dc82;
            --bg-dark: #0b0f14;
            --bg-card: #151a23;
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-muted: #94a3b8;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: white;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .event-card:hover {
            box-shadow: 0 10px 30px rgba(0, 220, 130, 0.25);
        }


        /* =====================
   NAVBAR - IMPROVED VERSION
===================== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 15, 20, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .nav-content {
            width: 100%;
            max-width: 1400px;
            height: 70px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* For larger screens, content is centered with max-width */
        @media (min-width: 1400px) {
            .nav-content {
                padding: 0 40px;
            }
        }

        /* For smaller screens, content touches edges */
        @media (max-width: 640px) {
            .nav-content {
                padding: 0 16px;
                height: 60px;
            }
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        @media (max-width: 640px) {
            .brand {
                font-size: 1.25rem;
            }
        }

        .brand span {
            color: var(--primary);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @media (min-width: 769px) {
            .nav-right {
                gap: 16px;
            }
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 40px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .nav-link:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-link.wallet-btn {
            background: rgba(0, 220, 130, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 220, 130, 0.2);
        }

        .nav-link.wallet-btn:hover {
            background: var(--primary);
            color: #000;
        }

        .menu-toggle {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* =====================
   BUTTONS & PROFILE
===================== */
        .btn-action {
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
        }

        .btn-primary:hover {
            background: #00b86b;
            transform: translateY(-2px);
        }

        .btn-logout {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.2);
            color: #ff4d4d;
            padding: 8px 20px;
            font-size: 0.95rem;
            border-radius: 40px;
        }

        .btn-logout:hover {
            background: #ff4d4d;
            color: white;
            border-color: #ff4d4d;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            white-space: nowrap;
        }

        .profile-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: #000;
            display: grid;
            place-items: center;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .profile-name {
            font-size: 0.9rem;
            color: white;
        }

        /* Tablet and Mobile Styles */
        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-right {
                display: none;
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                width: 100%;
                background: rgba(11, 15, 20, 0.98);
                backdrop-filter: blur(12px);
                flex-direction: column;
                align-items: stretch;
                padding: 16px 0;
                border-bottom: 1px solid var(--glass-border);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
                gap: 0;
                z-index: 999;
            }

            @media (max-width: 640px) {
                .nav-right {
                    top: 60px;
                }
            }

            .nav-right.active {
                display: flex;
            }

            .nav-link {
                padding: 16px 24px;
                border-radius: 0;
                text-align: left;
                font-size: 1rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .nav-link:last-of-type {
                border-bottom: none;
            }

            .nav-link.wallet-btn {
                margin: 8px 16px;
                border-radius: 40px;
                text-align: center;
                border: 1px solid rgba(0, 220, 130, 0.3);
            }

            .profile-box {
                margin: 16px 16px 8px;
                padding: 12px 16px;
                justify-content: center;
                background: rgba(255, 255, 255, 0.08);
                border: none;
            }

            .btn-logout {
                margin: 8px 16px 16px;
                padding: 14px;
                text-align: center;
                background: rgba(255, 77, 77, 0.15);
            }
        }

        /* Small mobile adjustments */
        @media (max-width: 480px) {
            .nav-link {
                padding: 14px 20px;
            }

            .profile-box {
                margin: 12px 12px 8px;
            }

            .btn-logout {
                margin: 8px 12px 12px;
            }
        }

        /* =====================
   PAGE CONTAINER
===================== */
        .container {
            width: 100%;
            max-width: 1200px;
            margin-inline: auto;
            padding: 100px 24px 60px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 90px 16px 40px;
            }
        }

        /* =====================
   SEARCH
===================== */
        .search-container {
            max-width: 600px;
            margin: 30px auto 50px;
            position: relative;
        }

        @media (max-width: 640px) {
            .search-container {
                margin: 20px auto 40px;
            }
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(0, 220, 130, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* =====================
   PAGE HEADER
===================== */
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 640px) {
            .page-header h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.8rem;
            }
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* =====================
   GRID & CARDS
===================== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
            gap: 30px;
        }

        @media (max-width: 640px) {
            .grid {
                gap: 20px;
            }
        }

        .event-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .event-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 220, 130, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* IMAGE */
        .card-image {
            height: 180px;
            position: relative;
        }

        @media (max-width: 480px) {
            .card-image {
                height: 160px;
            }
        }

        .svg-cover svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* CREATOR CONTROLS */
        .creator-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            padding: 6px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        .control-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .control-btn:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }

        .btn-delete:hover {
            background: #ff4d4d;
            color: white;
        }

        /* CARD BODY */
        .card-body {
            padding: 22px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        @media (max-width: 480px) {
            .card-body {
                padding: 18px;
            }
        }

        .card-body h3 {
            margin: 0 0 12px;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .meta-row {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 6px;
        }

        .meta-row i {
            color: var(--primary);
            width: 18px;
        }

        /* PROGRESS */
        .progress-container {
            margin: 14px 0;
        }

        .capacity-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* DESCRIPTION */
        .description {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin: 16px 0;
            flex-grow: 1;
            line-height: 1.5;
        }

        /* FOOTER ACTIONS */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--glass-border);
            flex-wrap: wrap;
        }

        .price-tag {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .btn-buy {
            padding: 8px 24px;
            border-radius: 999px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            background: var(--primary);
            color: #000;
        }

        .btn-buy:hover {
            background: #00b86b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 220, 130, 0.3);
        }

        .btn-buy:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =====================
   MODALS (keeping your existing modal styles)
===================== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            width: 100%;
            max-width: min(500px, 90vw);
            background: var(--bg-card);
            border-radius: 18px;
            padding: 28px;
            border: 1px solid var(--glass-border);
            max-height: 90vh;
            overflow-y: auto;
        }

        /* =====================
   FOOTER
===================== */
        footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 640px) {
            footer {
                padding: 30px 16px;
            }
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Keep all your existing modal styles below */
        /* Share Modal Styles */
        .social-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .social-btn:hover {
            transform: translateY(-5px);
            border-color: transparent;
            color: white;
        }

        /* Brand Colors on Hover */
        .whatsapp:hover {
            background: #25D366;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
        }

        .twitter:hover {
            background: #1DA1F2;
            box-shadow: 0 0 20px rgba(29, 161, 242, 0.4);
        }

        .facebook:hover {
            background: #1877F2;
            box-shadow: 0 0 20px rgba(24, 119, 242, 0.4);
        }

        .linkedin:hover {
            background: #0A66C2;
            box-shadow: 0 0 20px rgba(10, 102, 194, 0.4);
        }

        .copy-link:hover {
            background: #4B5563;
            box-shadow: 0 0 20px rgba(75, 85, 99, 0.4);
        }

        /* Close Button Style */
        .btn-cancel {
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            width: 100%;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 1rem;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Edit Modal Styles */
        .modal-content h2 {
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        .modal-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(0, 220, 130, 0.1);
        }

        textarea.modal-input {
            resize: vertical;
            min-height: 100px;
        }

        .modal-row {
            display: flex;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .modal-row {
                flex-direction: column;
                gap: 0;
            }
        }

        .btn-save {
            background: var(--primary);
            color: black;
            border: none;
            padding: 14px;
            flex: 2;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            background: #00b86b;
            transform: translateY(-2px);
        }

        /* Delete Modal Styles */
        .msg-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: block;
            text-align: center;
            color: #f59e0b;
            filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.3));
        }

        #confirmTitle {
            font-size: 1.5rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .msg-text {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.5;
        }

        .btn-confirm-delete {
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 14px;
            flex: 1;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-confirm-delete:hover {
            background: #ff4d4d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
            transform: translateY(-2px);
        }

        /* Modal Actions */
        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            .modal-actions {
                flex-direction: column;
            }

            .modal-actions button {
                width: 100%;
                flex: 1 !important;
            }
        }

        /* Message Modal */
        .msg-success {
            color: #00DC82;
            filter: drop-shadow(0 0 15px rgba(0, 220, 130, 0.4));
        }

        .msg-error {
            color: #ff4d4d;
            filter: drop-shadow(0 0 15px rgba(255, 77, 77, 0.4));
        }

        #messageModal .modal-content {
            text-align: center;
        }

        /* Print Styles */
        @media print {

            .menu-toggle,
            .creator-controls,
            .btn-buy,
            .control-btn,
            .btn-action,
            .btn-logout,
            .modal {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-container">
            <div class="nav-content">
                <a href="landing.html" class="brand">
                    <i class="fas fa-layer-group" style="color:#00DC82;"></i> Eventful<span>.</span>
                </a>

                <button class="menu-toggle" id="mobile-menu" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>

                <div class="nav-right" id="navRight"></div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Explore Events</h1>
            <p>Discover trending experiences around you</p>
        </div>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input id="searchInput" class="search-input" placeholder="Search by title, location, or vibe..." />
        </div>

        <div id="eventsGrid" class="grid">
            <p style="grid-column:1/-1;text-align:center;color:var(--text-muted); padding: 50px 20px;">
                Loading events...
            </p>
        </div>
    </div>

    <!-- Keep all your modal divs exactly as they were -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>✏️ Edit Event</h2>
            <form id="editForm">
                <input type="hidden" id="editEventId">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="editTitle" class="modal-input" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="editDesc" class="modal-input" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="editLocation" class="modal-input" required>
                </div>
                <div class="modal-row">
                    <div class="form-group" style="flex:1">
                        <label>Date</label>
                        <input type="date" id="editDate" class="modal-input" required>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Price (₦)</label>
                        <input type="number" id="editPrice" class="modal-input" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('editModal')">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="shareModal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h3>Share this Event</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Share this event with your friends!</p>

            <div class="social-grid">
                <a href="#" id="share-whatsapp" target="_blank" class="social-btn whatsapp" title="Share on WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="#" id="share-twitter" target="_blank" class="social-btn twitter" title="Share on Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="#" id="share-facebook" target="_blank" class="social-btn facebook" title="Share on Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" id="share-linkedin" target="_blank" class="social-btn linkedin" title="Share on LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <button onclick="copyToClipboard()" class="social-btn copy-link" title="Copy Link">
                    <i class="fas fa-link"></i>
                </button>
            </div>

            <button onclick="closeModal('shareModal')" class="btn-cancel" style="width:100%;">Close</button>
        </div>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <i class="fas fa-exclamation-circle msg-icon" style="color:#f59e0b;"></i>
            <h3 id="confirmTitle" style="color:white; margin-top:0;">Are you sure?</h3>
            <p id="confirmText" class="msg-text">This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('confirmModal')">Cancel</button>
                <button id="btnConfirmYes" class="btn-confirm-delete">Yes, Delete</button>
            </div>
        </div>
    </div>

    <div id="messageModal" class="modal">
        <div class="modal-content">
            <i id="msgIcon" class="fas fa-check-circle msg-icon msg-success"></i>
            <h3 id="msgTitle" style="color:white; margin:0 0 10px 0;">Success</h3>
            <p id="msgText" class="msg-text">Operation completed.</p>
            <button onclick="closeModal('messageModal')" class="btn-save">Okay</button>
        </div>
    </div>

    <footer>
        <p>
            Built with <i class="fas fa-heart" style="color:#ff4d4d;"></i> by
            <a href="https://github.com/OgeeTech" target="_blank">OgeeTech</a>
        </p>
        <p style="font-size: 0.8rem; margin-top: 10px; opacity: 0.6;">&copy; 2026 Eventful. All rights reserved.</p>
    </footer>

    <script>
        // Keep all your existing JavaScript exactly as it was
        const API_URL = "https://eventful-api-74t2.onrender.com/api";

        const token = localStorage.getItem('token');
        const userName = localStorage.getItem('userName') || 'User';
        const userId = localStorage.getItem('userId');
        const role = localStorage.getItem('role');
        const navRight = document.getElementById('navRight');

        const mobileMenuBtn = document.getElementById('mobile-menu');

        mobileMenuBtn.addEventListener('click', () => {
            navRight.classList.toggle('active');
            const icon = mobileMenuBtn.querySelector('i');
            if (navRight.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
                document.body.style.overflow = 'hidden';
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
                document.body.style.overflow = 'auto';
            }
        });

        document.addEventListener('click', (e) => {
            const nav = document.getElementById('navRight');
            const menuBtn = document.getElementById('mobile-menu');

            if (nav.classList.contains('active') &&
                !nav.contains(e.target) &&
                !menuBtn.contains(e.target)) {
                nav.classList.remove('active');
                menuBtn.querySelector('i').classList.remove('fa-times');
                menuBtn.querySelector('i').classList.add('fa-bars');
                document.body.style.overflow = 'auto';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && navRight.classList.contains('active')) {
                navRight.classList.remove('active');
                mobileMenuBtn.querySelector('i').classList.remove('fa-times');
                mobileMenuBtn.querySelector('i').classList.add('fa-bars');
                document.body.style.overflow = 'auto';
            }
        });

        if (token) {
            navRight.innerHTML = `
                ${role !== 'creator' ? '<a href="my-tickets.html" class="nav-link wallet-btn">My Wallet</a>' : ''}
                ${role === 'creator' ? '<a href="dashboard.html" class="nav-link">Dashboard</a>' : ''}
                <div class="profile-box">
                    <div class="profile-icon">${userName.charAt(0).toUpperCase()}</div>
                    <span class="profile-name">${userName}</span>
                </div>
                <button class="btn-action btn-logout" onclick="logout()">Logout</button>
            `;
        } else {
            navRight.innerHTML = `
                <a href="signin.html" class="nav-link">Login</a>
                <a href="signup.html" class="btn-action btn-primary">Sign Up</a>
            `;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'signin.html';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function showMessage(title, text, isSuccess = true) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            const icon = document.getElementById('msgIcon');
            icon.className = isSuccess ? "fas fa-check-circle msg-icon msg-success" : "fas fa-times-circle msg-icon msg-error";
            openModal('messageModal');
        }

        let confirmCallback = null;
        function showConfirm(text, callback) {
            document.getElementById('confirmText').innerText = text;
            confirmCallback = callback;
            openModal('confirmModal');
        }

        document.getElementById('btnConfirmYes').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeModal('confirmModal');
        });

        let allEvents = [];

        function generateEventSVG(event) {
            return `
    <svg viewBox="0 0 600 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="g-${event._id}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00dc82"/>
                <stop offset="100%" stop-color="#00b86b"/>
            </linearGradient>
        </defs>
        <rect width="600" height="300" fill="url(#g-${event._id})"/>
        <circle cx="520" cy="80" r="60" fill="rgba(255,255,255,0.15)" />
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
              fill="rgba(255,255,255,0.2)"
              font-size="60"
              font-weight="900"
              transform="rotate(-15, 300, 150)">
            EVENTFUL
        </text>
    </svg>`;
        }

        function renderEvents(events) {
            const grid = document.getElementById("eventsGrid");
            grid.innerHTML = "";

            if (!events || !events.length) {
                grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--text-muted); padding: 50px;">No events found.</p>`;
                return;
            }

            events.forEach(event => {
                const sold = event.sold || 0;
                const capacity = event.capacity || 100;
                const percent = Math.min((sold / capacity) * 100, 100);

                let creatorId = event.createdBy || event.creator;
                if (typeof creatorId === 'object' && creatorId !== null) {
                    creatorId = creatorId._id || creatorId.id;
                }

                const currentUserIdStr = String(userId).trim();
                const eventCreatorIdStr = String(creatorId).trim();
                const isOwner = token && (currentUserIdStr === eventCreatorIdStr);

                const controlsHtml = isOwner ? `
                    <div class="creator-controls">
                        <button class="control-btn" onclick="openEditModal('${event._id}')" title="Edit">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                        <button class="control-btn btn-delete" onclick="deleteEvent('${event._id}')" title="Delete">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                ` : '';

                grid.innerHTML += `
            <div class="event-card">
                <div class="card-image svg-cover">
                    ${generateEventSVG(event)}
                    ${controlsHtml}
                </div>

                <div class="card-body">
                    <h3>${event.title}</h3>
                    <div class="meta-row"><i class="fas fa-calendar-alt"></i> ${new Date(event.date).toDateString()}</div>
                    <div class="meta-row"><i class="fas fa-map-marker-alt"></i> ${event.location}</div>

                    <div class="progress-container">
                        <span class="capacity-text">${sold} / ${capacity} Sold</span>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${percent}%"></div></div>
                    </div>

                    <p class="description">${event.description ? event.description.substring(0, 80) + '...' : 'No description.'}</p>

                    <div class="card-footer">
                        <div class="price-tag">${event.price > 0 ? "₦" + event.price.toLocaleString() : "Free"}</div>
                        <div style="display:flex; gap:10px; align-items: center;">
                            <button class="control-btn" onclick="openShareModal('${event._id}')" title="Share">
                                <i class="fas fa-share-alt"></i>
                            </button>
                            <button class="btn-buy" onclick="buyTicket('${event._id}')" ${percent >= 100 ? 'disabled' : ''}>
                                ${percent >= 100 ? 'Sold Out' : 'Book Now'}
                            </button>
                        </div>
                    </div>
                </div>
            </div>`;
            });
        }

        function openEditModal(id) {
            const event = allEvents.find(e => e._id === id);
            if (!event) return;
            document.getElementById('editEventId').value = event._id;
            document.getElementById('editTitle').value = event.title;
            document.getElementById('editDesc').value = event.description;
            document.getElementById('editLocation').value = event.location;
            document.getElementById('editPrice').value = event.price;
            if (event.date) {
                document.getElementById('editDate').value = new Date(event.date).toISOString().split('T')[0];
            }
            openModal('editModal');
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editEventId').value;
            const updatedData = {
                title: document.getElementById('editTitle').value,
                description: document.getElementById('editDesc').value,
                location: document.getElementById('editLocation').value,
                date: document.getElementById('editDate').value,
                price: Number(document.getElementById('editPrice').value)
            };

            try {
                const res = await fetch(`${API_URL}/events/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(updatedData)
                });
                if (res.ok) {
                    closeModal('editModal');
                    showMessage("Success", "Event Updated! ✅");
                    loadEvents();
                } else {
                    const data = await res.json();
                    showMessage("Error", data.message, false);
                }
            } catch (err) { showMessage("Error", "Connection Error", false); }
        });

        function deleteEvent(id) {
            showConfirm("Are you sure you want to delete this event?", () => {
                executeDelete(id);
            });
        }

        async function executeDelete(id) {
            try {
                const res = await fetch(`${API_URL}/events/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    showMessage("Deleted", "Event Deleted! 🗑️");
                    loadEvents();
                } else {
                    const data = await res.json();
                    showMessage("Error", data.message, false);
                }
            } catch (err) { showMessage("Error", "Connection Error", false); }
        }

        let currentShareUrl = "";
        function openShareModal(id) {
            const event = allEvents.find(e => e._id === id);
            if (!event) return;
            currentShareUrl = `${window.location.origin}/index.html?event=${id}`;
            const text = encodeURIComponent(`Check out ${event.title} on Eventful!`);
            const url = encodeURIComponent(currentShareUrl);

            document.getElementById('share-whatsapp').href = `https://api.whatsapp.com/send?text=${text}%20${url}`;
            document.getElementById('share-twitter').href = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
            document.getElementById('share-facebook').href = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
            document.getElementById('share-linkedin').href = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;
            openModal('shareModal');
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(currentShareUrl).then(() => {
                showMessage("Success", "Link copied! 📋");
                closeModal('shareModal');
            });
        }

        document.getElementById("searchInput").addEventListener("input", e => {
            const term = e.target.value.toLowerCase();
            renderEvents(allEvents.filter(ev =>
                ev.title.toLowerCase().includes(term) ||
                ev.location.toLowerCase().includes(term) ||
                (ev.description && ev.description.toLowerCase().includes(term))
            ));
        });

        async function loadEvents() {
            try {
                const res = await fetch(`${API_URL}/events`);
                const data = await res.json();
                allEvents = data.events || data || [];
                renderEvents(allEvents);
            } catch (e) {
                console.error("Load Error:", e);
                document.getElementById("eventsGrid").innerHTML =
                    `<p style="grid-column:1/-1;text-align:center;color:#ff4d4d; padding: 50px 20px;">
                        Failed to load events. Please check your connection.
                    </p>`;
            }
        }

        async function buyTicket(eventId) {
            if (!token) {
                window.location.href = 'signin.html';
                return;
            }
            localStorage.setItem('pendingEventId', eventId);

            try {
                const response = await fetch(`${API_URL}/payments/initialize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ eventId })
                });
                const data = await response.json();

                if (response.ok) {
                    window.location.href = data.url;
                } else {
                    showMessage("Error", data.message, false);
                }
            } catch (e) {
                showMessage("Error", "Connection Error", false);
            }
        }

        loadEvents();
    </script>

</body>

</html>
