<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Events - Eventful</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./css/style.css">

    <style>
/* =====================
   ROOT & RESET
===================== */
:root {
    --primary: #00dc82;
    --bg-dark: #0b0f14;
    --bg-card: #151a23;
    --glass-border: rgba(255, 255, 255, 0.1);
    --text-muted: #94a3b8;
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg-dark);
    color: white;
    line-height: 1.6;
    overflow-x: hidden;
}

/* =====================
   NAVBAR
===================== */
nav {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem clamp(16px, 5vw, 60px);
    background: rgba(11, 15, 20, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--glass-border);
}

.brand {
    font-size: 1.5rem;
    font-weight: 800;
    color: white;
    text-decoration: none;
    letter-spacing: -0.5px;
}

.brand span {
    color: var(--primary);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

.nav-link {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: 0.3s;
}

.nav-link:hover {
    color: white;
}

.menu-toggle {
    display: none;
    font-size: 1.6rem;
    color: white;
    cursor: pointer;
}

/* =====================
   BUTTONS & PROFILE
===================== */
.btn-action {
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-decoration: none;
}

.btn-primary {
    background: var(--primary);
    color: #000;
}

.btn-logout {
    background: none;
    border: 1px solid #ff4d4d;
    color: #ff4d4d;
    padding: 6px 14px;
    font-size: 0.8rem;
}

.profile-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
}

.profile-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--primary);
    color: #000;
    display: grid;
    place-items: center;
    font-weight: bold;
    font-size: 0.8rem;
}

/* =====================
   PAGE CONTAINER
===================== */
.container {
    max-width: 1200px;
    margin-inline: auto;
    padding: 120px 16px 60px;
}

/* =====================
   SEARCH
===================== */
.search-container {
    max-width: 600px;
    margin: 30px auto 50px;
    position: relative;
}

.search-input {
    width: 100%;
    padding: 16px 20px 16px 50px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--glass-border);
    color: white;
    font-size: 1rem;
    outline: none;
}

.search-input:focus {
    border-color: var(--primary);
    background: rgba(255, 255, 255, 0.06);
}

.search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
}

/* =====================
   GRID & CARDS
===================== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 30px;
}

.event-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: 0.3s;
}

.event-card:hover {
    transform: translateY(-6px);
    background: rgba(255, 255, 255, 0.04);
}

/* IMAGE */
.card-image {
    height: 180px;
    position: relative;
}

.svg-cover svg {
    width: 100%;
    height: 100%;
    display: block;
}

/* CREATOR CONTROLS */
.creator-controls {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
    padding: 6px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.control-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: 0.2s;
}

.control-btn:hover {
    background: white;
    color: black;
}

.btn-delete:hover {
    background: #ff4d4d;
    color: white;
}

/* CARD BODY */
.card-body {
    padding: 22px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.card-body h3 {
    margin: 0 0 12px;
    font-size: 1.35rem;
    font-weight: 700;
}

.meta-row {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 0.9rem;
    color: #ccc;
    margin-bottom: 6px;
}

.meta-row i {
    color: var(--primary);
    width: 18px;
}

/* PROGRESS */
.progress-container {
    margin: 14px 0;
}

.capacity-text {
    font-size: 0.8rem;
    color: var(--text-muted);
}

.progress-bar-bg {
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar-fill {
    height: 100%;
    background: var(--primary);
}

/* DESCRIPTION */
.description {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin: 16px 0;
    flex-grow: 1;
}

/* FOOTER ACTIONS */
.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--glass-border);
}

.price-tag {
    font-size: 1.2rem;
    font-weight: 700;
}

.btn-buy {
    padding: 8px 24px;
    border-radius: 999px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.btn-buy:hover {
    background: var(--primary);
}

/* =====================
   MODALS
===================== */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(6px);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-content {
    width: 100%;
    max-width: 500px;
    background: var(--bg-card);
    border-radius: 18px;
    padding: 28px;
    border: 1px solid var(--glass-border);
}

/* =====================
   FOOTER
===================== */
footer {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-muted);
    font-size: 0.9rem;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

/* =====================
   RESPONSIVE
===================== */
@media (max-width: 900px) {
    .menu-toggle {
        display: block;
    }

    .nav-right {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: var(--bg-dark);
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
        gap: 12px;
        display: none;
    }

    .nav-right.active {
        display: flex;
    }

    .nav-link,
    .btn-action {
        width: 100%;
    }

    .profile-box {
        width: 100%;
        background: none;
        border: none;
        padding: 0;
    }

    .grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 110px 14px 50px;
    }

    .card-body h3 {
        font-size: 1.2rem;
    }

    .btn-buy {
        padding: 8px 18px;
        font-size: 0.85rem;
    }
}

    </style>
</head>

<body>

    <nav>
        <a href="landing.html" class="brand">
            <i class="fas fa-layer-group" style="color:#00DC82;"></i> Eventful<span>.</span>
        </a>

        <div class="menu-toggle" id="mobile-menu">
            <i class="fas fa-bars"></i>
        </div>

        <div class="nav-right" id="navRight"></div>
    </nav>

    <div class="container">
        <h1 style="text-align:center; font-size: 2.5rem; margin-bottom: 10px;">Explore Events</h1>
        <p style="text-align:center;color:var(--text-muted); font-size: 1.1rem;">Discover trending experiences around
            you</p>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input id="searchInput" class="search-input" placeholder="Search by title, location, or vibe..." />
        </div>

        <div id="eventsGrid" class="grid">
            <p style="grid-column:1/-1;text-align:center;color:var(--text-muted)">Loading events...</p>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>✏️ Edit Event</h2>
            <form id="editForm">
                <input type="hidden" id="editEventId">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="editTitle" class="modal-input" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="editDesc" class="modal-input" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="editLocation" class="modal-input" required>
                </div>
                <div class="modal-row">
                    <div class="form-group" style="flex:1">
                        <label>Date</label>
                        <input type="date" id="editDate" class="modal-input" required>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Price (₦)</label>
                        <input type="number" id="editPrice" class="modal-input" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('editModal')">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="shareModal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h3>Share this Event</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Share this event with your friends!</p>

            <div class="social-grid">
                <a href="#" id="share-whatsapp" target="_blank" class="social-btn whatsapp" title="Share on WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="#" id="share-twitter" target="_blank" class="social-btn twitter" title="Share on Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="#" id="share-facebook" target="_blank" class="social-btn facebook" title="Share on Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" id="share-linkedin" target="_blank" class="social-btn linkedin" title="Share on LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <button onclick="copyToClipboard()" class="social-btn copy-link" title="Copy Link">
                    <i class="fas fa-link"></i>
                </button>
            </div>

            <button onclick="closeModal('shareModal')" class="btn-cancel" style="width:100%;">Close</button>
        </div>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <i class="fas fa-exclamation-circle msg-icon" style="color:#f59e0b;"></i>
            <h3 id="confirmTitle" style="color:white; margin-top:0;">Are you sure?</h3>
            <p id="confirmText" class="msg-text">This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('confirmModal')">Cancel</button>
                <button id="btnConfirmYes" class="btn-confirm-delete">Yes, Delete</button>
            </div>
        </div>
    </div>

    <div id="messageModal" class="modal">
        <div class="modal-content">
            <i id="msgIcon" class="fas fa-check-circle msg-icon msg-success"></i>
            <h3 id="msgTitle" style="color:white; margin:0 0 10px 0;">Success</h3>
            <p id="msgText" class="msg-text">Operation completed.</p>
            <button onclick="closeModal('messageModal')" class="btn-save">Okay</button>
        </div>
    </div>

    <footer>
        <p>
            Built with <i class="fas fa-heart heart-icon"></i> by
            <a href="https://github.com/OgeeTech" target="_blank">OgeeTech</a>
        </p>
        <p style="font-size: 0.8rem; margin-top: 10px; opacity: 0.6;">&copy; 2026 Eventful. All rights reserved.</p>
    </footer>

    <script>
        // 👇 1. POINT TO RENDER CLOUD SERVER
        const API_URL = "https://eventful-api-74t2.onrender.com/api";

        // --- 1. SETUP & AUTH ---
        const token = localStorage.getItem('token');
        const userName = localStorage.getItem('userName') || 'User';
        const userId = localStorage.getItem('userId');
        const role = localStorage.getItem('role');
        const navRight = document.getElementById('navRight');

        // Mobile Menu Toggle Logic
        const mobileMenuBtn = document.getElementById('mobile-menu');

        mobileMenuBtn.addEventListener('click', () => {
            navRight.classList.toggle('active');
            const icon = mobileMenuBtn.querySelector('i');
            if (navRight.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        });

        if (token) {
            navRight.innerHTML = `
                <a href="my-tickets.html" class="nav-link">My Wallet</a>
                ${role === 'creator' ? '<a href="dashboard.html" class="nav-link">Dashboard</a>' : ''}
                <div class="profile-box">
                    <div class="profile-icon">${userName.charAt(0).toUpperCase()}</div>
                    <span class="profile-name">${userName}</span>
                </div>
                <button class="btn-action btn-logout" onclick="logout()">Logout</button>
            `;
        } else {
            navRight.innerHTML = `
                <a href="signin.html" class="nav-link">Login</a>
                <a href="signup.html" class="btn-action btn-primary">Sign Up</a>
            `;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'signin.html';
        }

        // --- 2. MODAL HELPER FUNCTIONS ---
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function showMessage(title, text, isSuccess = true) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            const icon = document.getElementById('msgIcon');
            icon.className = isSuccess ? "fas fa-check-circle msg-icon msg-success" : "fas fa-times-circle msg-icon msg-error";
            document.getElementById('messageModal').style.display = 'flex';
        }

        let confirmCallback = null;
        function showConfirm(text, callback) {
            document.getElementById('confirmText').innerText = text;
            confirmCallback = callback;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        document.getElementById('btnConfirmYes').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeModal('confirmModal');
        });

        // --- 3. RENDER EVENTS ---
        let allEvents = [];

        function generateEventSVG(event) {
            const colors = [["#00dc82", "#0066ff"], ["#ff7a18", "#ffb347"], ["#7f00ff", "#e100ff"], ["#ff4d4d", "#ff9a9e"]];
            const index = (event._id || 'a').charCodeAt(0) % colors.length;
            const [c1, c2] = colors[index];
            return `
            <svg viewBox="0 0 600 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="g-${event._id}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs>
                <rect width="600" height="300" fill="url(#g-${event._id})"/>
                <circle cx="520" cy="80" r="60" fill="rgba(255,255,255,0.15)" />
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="60" font-weight="900" transform="rotate(-15, 300, 150)">EVENTFUL</text>
            </svg>`;
        }

        function renderEvents(events) {
            const grid = document.getElementById("eventsGrid");
            grid.innerHTML = "";

            if (!events || !events.length) {
                grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--text-muted); padding: 50px;">No events found.</p>`;
                return;
            }

            events.forEach(event => {
                const sold = event.sold || 0;
                const capacity = event.capacity || 100;
                const percent = Math.min((sold / capacity) * 100, 100);

                let creatorId = event.createdBy || event.creator;
                if (typeof creatorId === 'object' && creatorId !== null) {
                    creatorId = creatorId._id || creatorId.id;
                }

                const currentUserIdStr = String(userId).trim();
                const eventCreatorIdStr = String(creatorId).trim();
                const isOwner = token && (currentUserIdStr === eventCreatorIdStr);

                const controlsHtml = isOwner ? `
                    <div class="creator-controls">
                        <button class="control-btn" onclick="openEditModal('${event._id}')" title="Edit">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                        <button class="control-btn btn-delete" onclick="deleteEvent('${event._id}')" title="Delete">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                ` : '';

                grid.innerHTML += `
            <div class="event-card">
                <div class="card-image svg-cover">
                    ${generateEventSVG(event)}
                    ${controlsHtml}
                </div>

                <div class="card-body">
                    <h3>${event.title}</h3>
                    <div class="meta-row"><i class="fas fa-calendar-alt"></i> ${new Date(event.date).toDateString()}</div>
                    <div class="meta-row"><i class="fas fa-map-marker-alt"></i> ${event.location}</div>

                    <div class="progress-container">
                        <span class="capacity-text">${sold} / ${capacity} Sold</span>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${percent}%"></div></div>
                    </div>

                    <p class="description">${event.description ? event.description.substring(0, 80) + '...' : 'No description.'}</p>

                    <div class="card-footer">
                        <div class="price-tag">${event.price > 0 ? "₦" + event.price.toLocaleString() : "Free"}</div>
                        <div style="display:flex; gap:10px;">
                            <button class="control-btn" onclick="openShareModal('${event._id}')" title="Share">
                                <i class="fas fa-share-alt"></i>
                            </button>
                            <button class="btn-buy" onclick="buyTicket('${event._id}')">
                                ${percent >= 100 ? 'Sold Out' : 'Book Now'}
                            </button>
                        </div>
                    </div>
                </div>
            </div>`;
            });
        }

        // --- 4. EDIT & DELETE LOGIC ---
        function openEditModal(id) {
            const event = allEvents.find(e => e._id === id);
            if (!event) return;
            document.getElementById('editEventId').value = event._id;
            document.getElementById('editTitle').value = event.title;
            document.getElementById('editDesc').value = event.description;
            document.getElementById('editLocation').value = event.location;
            document.getElementById('editPrice').value = event.price;
            if (event.date) {
                document.getElementById('editDate').value = new Date(event.date).toISOString().split('T')[0];
            }
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editEventId').value;
            const updatedData = {
                title: document.getElementById('editTitle').value,
                description: document.getElementById('editDesc').value,
                location: document.getElementById('editLocation').value,
                date: document.getElementById('editDate').value,
                price: Number(document.getElementById('editPrice').value)
            };

            try {
                const res = await fetch(`${API_URL}/events/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(updatedData)
                });
                if (res.ok) {
                    closeEditModal();
                    showMessage("Success", "Event Updated! ✅");
                    loadEvents();
                } else {
                    const data = await res.json();
                    showMessage("Error", data.message, false);
                }
            } catch (err) { showMessage("Error", "Connection Error", false); }
        });

        function deleteEvent(id) {
            showConfirm("Are you sure you want to delete this event?", () => {
                executeDelete(id);
            });
        }

        async function executeDelete(id) {
            try {
                const res = await fetch(`${API_URL}/events/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    showMessage("Deleted", "Event Deleted! 🗑️");
                    loadEvents();
                } else {
                    const data = await res.json();
                    showMessage("Error", data.message, false);
                }
            } catch (err) { showMessage("Error", "Connection Error", false); }
        }

        // --- 5. SHARE LOGIC ---
        let currentShareUrl = "";
        function openShareModal(id) {
            const event = allEvents.find(e => e._id === id);
            if (!event) return;
            currentShareUrl = `${window.location.origin}/index.html?event=${id}`;
            const text = encodeURIComponent(`Check out ${event.title} on Eventful!`);
            const url = encodeURIComponent(currentShareUrl);

            document.getElementById('share-whatsapp').href = `https://api.whatsapp.com/send?text=${text}%20${url}`;
            document.getElementById('share-twitter').href = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
            document.getElementById('share-facebook').href = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
            document.getElementById('share-linkedin').href = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;
            document.getElementById('shareModal').style.display = 'flex';
        }
        function closeShareModal() { document.getElementById('shareModal').style.display = 'none'; }

        function copyToClipboard() {
            navigator.clipboard.writeText(currentShareUrl).then(() => {
                showMessage("Success", "Link copied! 📋");
                closeShareModal();
            });
        }

        // --- 6. LOAD & SEARCH ---
        document.getElementById("searchInput").addEventListener("input", e => {
            const term = e.target.value.toLowerCase();
            renderEvents(allEvents.filter(ev => ev.title.toLowerCase().includes(term) || ev.location.toLowerCase().includes(term)));
        });

        async function loadEvents() {
            try {
                const res = await fetch(`${API_URL}/events`);
                const data = await res.json();
                allEvents = data.events || data || [];
                renderEvents(allEvents);
            } catch (e) {
                console.error("Load Error:", e);
                document.getElementById("eventsGrid").innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#ff4d4d">Failed to load events. Check console.</p>`;
            }
        }

        async function buyTicket(eventId) {
            if (!token) { window.location.href = 'signin.html'; return; }
            localStorage.setItem('pendingEventId', eventId);

            try {
                const response = await fetch(`${API_URL}/payments/initialize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ eventId })
                });
                const data = await response.json();

                if (response.ok) {
                    window.location.href = data.url;
                } else {
                    showMessage("Error", data.message, false);
                }
            } catch (e) {
                showMessage("Error", "Connection Error", false);
            }
        }

        loadEvents();
    </script>

</body>

</html>
