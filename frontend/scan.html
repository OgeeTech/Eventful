<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - Eventful</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body {
            background-color: #0B0E14;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .scanner-container {
            background: rgba(21, 26, 35, 0.95);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        h2 {
            margin: 0 0 10px;
            color: #fff;
            font-size: 1.8rem;
        }

        p {
            color: #94A3B8;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #00DC82;
            background: rgba(0, 220, 130, 0.1);
            box-shadow: 0 -2px 5px rgba(0, 220, 130, 0.2);
        }

        /* Camera Section */
        #cameraSection {
            margin-bottom: 20px;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #00DC82;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 20px rgba(0, 220, 130, 0.4);
        }

        #reader__dashboard_section_csr span {
            display: none !important;
            /* Hide link */
        }

        /* Manual Section */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            outline: none;
            text-align: center;
            font-family: monospace;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00DC82;
            box-shadow: 0 0 8px rgba(0, 220, 130, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        .btn-scan {
            padding: 12px 20px;
            background: #00DC82;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-scan:hover {
            background: #00b86b;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 220, 130, 0.4);
        }

        /* Result Box */
        #result {
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 0.95rem;
            display: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        #result.valid {
            background: rgba(0, 220, 130, 0.15);
            border: 1px solid #00DC82;
            color: #00DC82;
            box-shadow: 0 0 15px rgba(0, 220, 130, 0.3);
        }

        #result.invalid {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.3);
        }

        /* Back Link */
        .back-link {
            color: #94A3B8;
            text-decoration: none;
            font-size: 0.85rem;
            display: block;
            margin-top: 20px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #00DC82;
            text-decoration: underline;
        }

        /* Spinner Icon Fix */
        #result i.fa-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="scanner-container">
        <h2>🎟️ Ticket Validator</h2>
        <p>Scan a QR code or enter the Ticket ID manually.</p>

        <div class="tabs">
            <button class="tab-btn active" id="tabCamera" onclick="switchMode('camera')">📷 Camera</button>
            <button class="tab-btn" id="tabManual" onclick="switchMode('manual')">⌨️ Manual</button>
        </div>

        <div id="cameraSection">
            <div id="reader"></div>
            <p style="font-size:0.8rem; margin-top:5px;">Permission required to access camera</p>
        </div>

        <div id="manualSection" style="display: none;">
            <div class="input-group">
                <input type="text" id="ticketId" placeholder="Enter Ticket ID" />
                <button class="btn-scan" onclick="verifyTicket()">Check</button>
            </div>
        </div>

        <div id="result"></div>

        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <audio id="beepSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

    <script>
        // 👇 1. POINT TO RENDER CLOUD SERVER
        const API_URL = "https://eventful-api-74t2.onrender.com/api";

        let html5QrcodeScanner;
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (!token || role !== 'creator') {
            alert("Creator access required.");
            window.location.href = 'signin.html';
        }

        // Switch Tabs
        function switchMode(mode) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            if (mode === 'camera') {
                document.getElementById('tabCamera').classList.add('active');
                document.getElementById('cameraSection').style.display = 'block';
                document.getElementById('manualSection').style.display = 'none';
                startScanner();
            } else {
                document.getElementById('tabManual').classList.add('active');
                document.getElementById('cameraSection').style.display = 'none';
                document.getElementById('manualSection').style.display = 'block';
                stopScanner();
                document.getElementById('ticketId').focus();
            }
            document.getElementById('result').style.display = 'none';
        }

        // --- CAMERA SCANNER LOGIC ---
        function startScanner() {
            if (html5QrcodeScanner) return;

            setTimeout(() => {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader",
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    /* verbose= */ false
                );

                html5QrcodeScanner.render((decodedText) => {
                    console.log(`Scan result: ${decodedText}`);
                    stopScanner();
                    document.getElementById('ticketId').value = decodedText;
                    switchMode('manual');
                    verifyTicket(decodedText);
                }, (error) => {
                    // Ignore minor scan errors
                });
            }, 100);
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                try {
                    html5QrcodeScanner.clear().then(() => {
                        html5QrcodeScanner = null;
                    }).catch(err => console.error("Failed to clear scanner", err));
                } catch (e) {
                    html5QrcodeScanner = null;
                }
            }
        }

        // --- VERIFY TICKET LOGIC ---
        async function verifyTicket(scannedId = null) {
            const ticketId = scannedId || document.getElementById('ticketId').value.trim();
            const resultDiv = document.getElementById('result');

            if (!ticketId) return;

            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            console.log("Checking Ticket ID:", ticketId);

            try {
                // 👇 USE API_URL HERE
                const response = await fetch(`${API_URL}/tickets/validate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ ticketId })
                });

                console.log("Response Status:", response.status);

                if (!response.ok) {
                    const data = await response.json();
                    resultDiv.className = "invalid";
                    resultDiv.innerHTML = `
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem;"></i><br>
                        <strong>Scan Failed</strong>
                        <div style="margin-top:10px; font-size:0.9rem;">
                            ${data.message || "Unknown Error"}
                        </div>
                    `;
                    return;
                }

                const data = await response.json();

                if (data.valid) {
                    resultDiv.className = "valid";
                    resultDiv.innerHTML = `
                        <i class="fas fa-check-circle" style="font-size: 2rem;"></i><br>
                        <strong>Valid Ticket!</strong>
                        <div style="margin-top:10px; font-size:0.9rem; color:#fff;">
                            Attendee: <b>${data.attendee.name}</b><br>
                            ${data.message}
                        </div>
                    `;
                    document.getElementById('beepSound').play();
                } else {
                    resultDiv.className = "invalid";
                    resultDiv.innerHTML = `
                        <i class="fas fa-times-circle" style="font-size: 2rem;"></i><br>
                        <strong>Invalid Ticket</strong>
                        <div style="margin-top:10px; font-size:0.9rem;">${data.message}</div>
                    `;
                }
            } catch (err) {
                console.error("Network Error:", err);
                resultDiv.className = "invalid";
                resultDiv.innerText = "Network Failure: Please check your internet.";
            }
        }

        // Start scanner on load
        startScanner();
    </script>

</body>

</html>
